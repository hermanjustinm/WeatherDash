<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WeatherDash Remote Viewer</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div><h1>WeatherDash Remote Viewer</h1><small id="clock"></small></div>
    <div id="summary"></div>
  </header>
  <section id="alertBanner" class="alert-banner hidden"></section>
  <main class="grid">
    <section class="card radar"><h2>Live Radar</h2><iframe id="radarFrame" src="https://www.rainviewer.com/map.html?loc=47.0379,-122.9007,8&oFa=0&oC=1&oU=0&oCS=1&oF=0&c=1&o=83&lm=1&layer=radar"></iframe></section>
    <section class="card forecast"><h2>Forecast</h2><div id="current"></div><h3>Hourly</h3><div id="hourly" class="hscroll"></div><h3>7-Day</h3><div id="daily" class="daily"></div></section>
    <section class="card right"><h2>Alerts & Infra</h2><div id="alerts"></div><div id="aqi"></div><div id="wind"></div><div id="sun"></div><div id="river"></div><div id="tides"></div><div id="health"></div></section>
  </main>
  <section class="card cams"><h2>Traffic Cams (WADOT)</h2><div id="camsGrid" class="cams-grid"></div></section>
  <script>
    window.WEATHERDASH_API_URL = "http://127.0.0.1:5000/api/dashboard";
  </script>
  <script src="./app.js"></script>
</body>
</html>
