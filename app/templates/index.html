<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>WeatherDash Olympia</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='css/styles.css') }}" />
</head>
<body>
  <header class="topbar">
    <div><h1>Olympia Weather + Infrastructure Dashboard</h1><small id="clock"></small></div>
    <div id="summary"></div>
  </header>
  <section id="alertBanner" class="alert-banner hidden"></section>
  <main class="grid">
    <section class="card radar"><h2>Live Radar</h2><iframe id="radarFrame" src="https://www.rainviewer.com/map.html?loc=47.0379,-122.9007,8&oFa=0&oC=1&oU=0&oCS=1&oF=0&c=1&o=83&lm=1&layer=radar" loading="lazy"></iframe></section>
    <section class="card forecast"><h2>Forecast</h2><div id="current"></div><h3>Hourly</h3><div id="hourly" class="hscroll"></div><h3>7-Day</h3><div id="daily" class="daily"></div></section>
    <section class="card right"><h2>Alerts & Infra</h2><div id="alerts"></div><div id="aqi"></div><div id="wind"></div><div id="sun"></div><div id="river"></div><div id="tides"></div><div id="power"><h3>Power Outages</h3><iframe src="{{ settings.power_outage_embed_url }}"></iframe></div><div id="health"></div></section>
  </main>
  <section class="card cams"><h2>Traffic Cams (WADOT)</h2><div id="camsGrid" class="cams-grid"></div></section>
  <script>window.WD_CONFIG = { lightningEmbedUrl: "{{ settings.lightning_embed_url }}" };</script>
  <script src="{{ url_for('static', filename='js/app.js') }}"></script>
</body>
</html>
